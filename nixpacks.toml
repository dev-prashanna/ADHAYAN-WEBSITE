[phases.setup]
nixPkgs = ["python312", "pip"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python -m flask --app run db upgrade",
  "python scripts/init_db.py",
  "python scripts/import_content.py",
]

[deploy]
startCommand = "gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60"
